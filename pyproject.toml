
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-predictor"
version = "0.1.0"
description = "Premier League prediction and season simulation"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "streamlit>=1.40,<2",
    "requests>=2.32,<3",
    "soccerdata",
    "python-dotenv",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
