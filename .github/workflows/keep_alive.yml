
name: Keep Render Awake

on:
  schedule:
    # Every 10 minutes, every day
    - cron: "3,13,23,33,43,53 * * * *"

  # Also allow manual testing
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 120 \
            https://epl-forecast-engine.onrender.com/_stcore/health

          echo "Render health check completed"
