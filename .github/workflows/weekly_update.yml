
name: Weekly EPL Update

on:
  schedule:
    - cron: "30 10 * * 1"
      timezone: "Europe/Athens"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-epl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Refresh EPL predictions
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
        run: python -m epl_predictor.refresh_project

      # Preserve downloaded data, even if predictions fail
      - name: Commit updated data
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            data/raw/epl_2026_27.csv \
            data/raw/current_xg_baseline.csv \
            data/raw/current_match_xg.csv \
            data/processed/current_features.csv \
            data/processed/current_predictions.csv
            data/processed/season_simulation.csv
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update weekly EPL predictions"
            git push
          else
            echo "No data changes to commit"
          fi
