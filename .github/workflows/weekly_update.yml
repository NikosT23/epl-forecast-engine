
name: Weekly EPL Update

on:
  schedule:
    # Every Tuesday at 10:30 AM Athens time
    - cron: "30 10 * * 2"
      timezone: "Europe/Athens"

  # Allow us to manually run the workflow from GitHub
  workflow_dispatch:

# Allow GitHub Actions to commit updated CSV files
permissions:
  contents: write

# Prevent multiple refresh jobs from running simultaneously
concurrency:
  group: weekly-epl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Download our repository onto the GitHub runner
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      # Use the same Python version as our local project
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the project and its Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # Run the complete weekly prediction pipeline
      - name: Refresh EPL predictions
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
        run: python -m epl_predictor.refresh_project

      # Save downloaded data even if a later step fails
      - name: Commit updated data
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            data/raw/epl_2026_27.csv \
            data/raw/current_xg_baseline.csv \
            data/raw/current_match_xg.csv \
            data/processed/current_features.csv \
            data/processed/current_predictions.csv \
            data/processed/season_simulation.csv
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update weekly EPL predictions"
            git push
          else
            echo "No data changes to commit"
          fi
